name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      # `npm install`, not `npm ci`: the lockfile is generated on Windows, but the
      # Vite 8 native toolchain (rolldown/oxc -> @napi-rs/wasm-runtime -> @emnapi/*)
      # resolves a wasm fallback on Linux that Windows never installs, so a
      # Windows-authored lockfile can't satisfy strict `npm ci` here. `npm install`
      # reconciles per-platform. `--ignore-scripts` blocks dependency lifecycle
      # scripts (supply-chain hardening); the only dep with one is fsevents,
      # a macOS-only optional that never installs here.
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Via the npm script (local playwright binary), not npx, so nothing can be
      # installed on demand; --with-deps adds the Linux browser libraries.
      - run: npm run e2e:install -- --with-deps
      - run: npm run test:e2e

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Tauri v2 + whisper-rs (bindgen/cmake) + ort build prerequisites. webkit2gtk
      # 4.1 is the Tauri 2 webview; libclang-dev lets whisper-rs bindgen find libclang;
      # cmake builds whisper-rs-sys. ort downloads onnxruntime at build time.
      - name: Install Tauri + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            build-essential curl wget file cmake libclang-dev
      # SHA-pinned; this action normally reads the toolchain from the ref name
      # (@stable), so the pinned form must pass it explicitly.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      # Compiles the Tauri app crate (so Rust regressions are caught in CI, not just
      # locally) and runs the hermetic unit tests; the model/engine-driven tests are
      # #[ignore] and skipped.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

  security:
    runs-on: ubuntu-latest
    # On a `pull_request` event the gitleaks action lists the PR's commits via the API,
    # which needs `pull-requests: read`; without it the default token returns 403
    # "Resource not accessible by integration" and the job fails before scanning.
    # `contents: read` covers checkout. (push-event scans don't hit that API.)
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the pushed commit range, so it needs full history,
          # not the default shallow (depth 1) clone.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - run: npm install --no-audit --no-fund --ignore-scripts
      # Dependency + secret audits. The dep audits are informational (advisories the
      # owner can triage); the secret scan is blocking (secrets must never land).
      - name: npm audit (high and up)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
        continue-on-error: true
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
