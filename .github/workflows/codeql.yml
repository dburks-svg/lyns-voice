name: CodeQL

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Weekly, so newly-disclosed patterns get caught even without a push.
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:javascript-typescript'
        # Uploading results requires "code scanning" enabled on the repo (GitHub Advanced
        # Security for private repos, or a public repo). Until then the upload step errors;
        # keep it non-blocking so CI stays green. The analysis still runs each push, and
        # enabling code scanning in Settings > Security turns on the alerts with no change here.
        continue-on-error: true
